name: C CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      filename:
        description: 'The name of the file to modify'
        required: true
        default: 'hello.c'
        
jobs:                
  run-code:
    runs-on: ubuntu-latest
    steps:
    - name: Step security
      uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
      with:
        egress-policy: audit
    - name: Simple test action
      id: docker
      uses: shovon0203/docker-action@main
      with:
        who-to-greet: 'Shovon!; ls'
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run modification script
      run: |
        FILENAME=${{ github.event.inputs.filename }}
        echo "Appending function to $FILENAME"
        cat <<EOT >> $FILENAME
        void newFunction() {
          printf("Appended Code");
        }
        EOT
        
    - name: Set up build environment
      run: sudo apt-get install -y gcc make
    - name: Build
      run: make
    - name: Test executable
      run: ./hello
